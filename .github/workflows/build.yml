name: Build Pipe Store APK

on:
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Release APK
        run: |
          cp lib/main.dart /tmp/main.dart
          flutter create . --platforms=android --org com.pipestore
          cp /tmp/main.dart lib/main.dart
          flutter pub add intl uuid path_provider
          flutter build apk --release --split-per-abi=false

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: PipeStore-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
