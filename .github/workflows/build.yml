name: Build Pipe Store Apps (Android & Windows)

on:
  workflow_dispatch:

jobs:
  # 1. Android APK Build
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Release APK
        run: |
          mkdir -p /tmp/backup
          if [ -f lib/main.dart ]; then cp lib/main.dart /tmp/backup/main.dart; fi
          flutter create --project-name pipe_inventory --platforms=android,windows --org com.pipestore .
          if [ -f /tmp/backup/main.dart ]; then cp /tmp/backup/main.dart lib/main.dart; fi
          flutter pub add intl uuid path_provider http
          flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: PipeStore-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  # 2. Windows PC Build
  build-windows:
    name: Build Windows PC App
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Windows Executable
        run: |
          flutter config --enable-windows-desktop
          mkdir temp_backup -Force
          if (Test-Path "lib/main.dart") { Copy-Item "lib/main.dart" "temp_backup/main.dart" -Force }
          flutter create --project-name pipe_inventory --platforms=windows --org com.pipestore .
          if (Test-Path "temp_backup/main.dart") { Copy-Item "temp_backup/main.dart" "lib/main.dart" -Force }
          flutter pub add intl uuid path_provider http
          flutter build windows --release
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "PipeStore-Windows-PC.zip" -Force

      - name: Upload Windows App
        uses: actions/upload-artifact@v4
        with:
          name: PipeStore-Windows-PC
          path: PipeStore-Windows-PC.zip
